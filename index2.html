<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هایپر پاندا | محاسبه‌گر تخم‌مرغ</title>
<link rel="manifest" href="manifest.json">
<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#f4f5f7;
    color:#222;
}

.header{
    background:#111;
    color:white;
    padding:22px 18px;
    text-align:center;
}

.brand{
    font-size:28px;
    font-weight:bold;
    margin-bottom:8px;
}

.header h1{
    margin:0;
    font-size:21px;
}

.header p{
    margin:8px 0 0;
    color:#bbb;
    font-size:13px;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.card h2{
    margin-top:0;
    font-size:19px;
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
    background:white;
}

input:focus{
    border-color:#111;
}

button{
    width:100%;
    border:none;
    border-radius:13px;
    padding:15px;
    margin-top:20px;
    background:#111;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.secondary{
    background:#eee;
    color:#222;
    margin-top:10px;
}

.result{
    display:none;
}

.result-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #eee;
    gap:15px;
}

.result-row:last-child{
    border-bottom:none;
}

.result-label{
    color:#666;
    font-size:14px;
}

.result-value{
    font-weight:bold;
    text-align:left;
}

.profit{
    background:#f0f8f0;
    border-radius:12px;
    padding:5px 12px;
    margin-top:12px;
}

.error{
    display:none;
    background:#ffe8e8;
    color:#b00020;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:14px;
}

.saved{
    display:none;
    background:#e8f5e9;
    color:#246b2a;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:14px;
}

.footer{
    text-align:center;
    color:#888;
    font-size:12px;
    padding:18px;
    line-height:2;
}

.developer{
    color:#555;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
    <div class="brand">هایپر پاندا</div>
    <h1>🥚 محاسبه‌گر تخم‌مرغ</h1>
    <p>محاسبه خرید، فروش و سود و زیان</p>
</div>

<div class="container">

<div class="card">

<h2>🛒 اطلاعات خرید</h2>

<label>قیمت خرید هر کیلوگرم</label>
<input id="purchasePrice" type="number" inputmode="decimal" placeholder="مثلاً 2400000">

<label>وزن کل با کارتن (کیلوگرم)</label>
<input id="totalWeight" type="number" inputmode="decimal" step="0.001" placeholder="مثلاً 12.750">

<label>تعداد واقعی تخم‌مرغ</label>
<input id="eggCount" type="number" inputmode="numeric" placeholder="مثلاً 180">

</div>

<div class="card">

<h2>💰 اطلاعات فروش</h2>

<label>قیمت فروش هر کیلوگرم</label>
<input id="salePrice" type="number" inputmode="decimal" placeholder="مثلاً 3000000">

<button onclick="calculateAll()">محاسبه خرید، فروش و سود</button>

<button class="secondary" onclick="loadSaved()">📂 بازیابی آخرین اطلاعات</button>

<div id="error" class="error"></div>
<div id="saved" class="saved"></div>

</div>

<div id="result" class="card result">

<h2>📊 نتیجه نهایی</h2>

<div class="result-row">
<span class="result-label">پارسنگ کارتن</span>
<span class="result-value">1.200 کیلو</span>
</div>

<div class="result-row">
<span class="result-label">وزن خالص</span>
<span id="netWeight" class="result-value"></span>
</div>

<div class="result-row">
<span class="result-label">مبلغ کل خرید</span>
<span id="totalPurchase" class="result-value"></span>
</div>

<div class="result-row">
<span class="result-label">قیمت خرید هر عدد</span>
<span id="pricePerEgg" class="result-value"></span>
</div>

<div class="result-row">
<span class="result-label">مبلغ کل فروش</span>
<span id="totalSale" class="result-value"></span>
</div>

<div class="result-row">
<span class="result-label">قیمت فروش هر عدد</span>
<span id="salePerEgg" class="result-value"></span>
</div>

<div class="profit">

<div class="result-row">
<span class="result-label">سود کل</span>
<span id="totalProfit" class="result-value"></span>
</div>

<div class="result-row">
<span class="result-label">سود هر عدد</span>
<span id="profitPerEgg" class="result-value"></span>
</div>

<div class="result-row">
<span class="result-label">درصد سود</span>
<span id="profitPercent" class="result-value"></span>
</div>

</div>

</div>

</div>

<div class="footer">
<div class="developer">برنامه‌نویس: Meysam</div>
<div>09356441014</div>
<div>هایپر پاندا</div>
</div>

<script>

const PAR_SANG = 1.2;

function formatNumber(number){
    return new Intl.NumberFormat('fa-IR').format(Math.round(number));
}

function formatWeight(number){
    return number.toFixed(3);
}

function calculateAll(){

    const purchasePrice =
        parseFloat(document.getElementById("purchasePrice").value);

    const totalWeight =
        parseFloat(document.getElementById("totalWeight").value);

    const eggCount =
        parseInt(document.getElementById("eggCount").value);

    const salePrice =
        parseFloat(document.getElementById("salePrice").value);

    const error =
        document.getElementById("error");

    const saved =
        document.getElementById("saved");

    const result =
        document.getElementById("result");

    error.style.display="none";
    saved.style.display="none";

    if(
        isNaN(purchasePrice) ||
        isNaN(totalWeight) ||
        isNaN(eggCount) ||
        isNaN(salePrice)
    ){

        error.innerText="لطفاً تمام اطلاعات خرید و فروش را وارد کنید.";
        error.style.display="block";
        result.style.display="none";
        return;
    }

    if(purchasePrice <= 0){

        error.innerText="قیمت خرید باید بیشتر از صفر باشد.";
        error.style.display="block";
        result.style.display="none";
        return;
    }

    if(totalWeight <= PAR_SANG){

        error.innerText="وزن کل باید بیشتر از 1.200 کیلوگرم باشد.";
        error.style.display="block";
        result.style.display="none";
        return;
    }

    if(eggCount <= 0){

        error.innerText="تعداد تخم‌مرغ باید بیشتر از صفر باشد.";
        error.style.display="block";
        result.style.display="none";
        return;
    }

    if(salePrice <= 0){

        error.innerText="قیمت فروش باید بیشتر از صفر باشد.";
        error.style.display="block";
        result.style.display="none";
        return;
    }

    const netWeight =
        totalWeight - PAR_SANG;

    const totalPurchase =
        purchasePrice * totalWeight;

    const pricePerEgg =
        totalPurchase / eggCount;

    const totalSale =
        salePrice * netWeight;

    const salePerEgg =
        totalSale / eggCount;

    const totalProfit =
        totalSale - totalPurchase;

    const profitPerEgg =
        totalProfit / eggCount;

    const profitPercent =
        (totalProfit / totalPurchase) * 100;

    document.getElementById("netWeight").innerText =
        formatWeight(netWeight)+" کیلو";

    document.getElementById("totalPurchase").innerText =
        formatNumber(totalPurchase)+" تومان";

    document.getElementById("pricePerEgg").innerText =
        formatNumber(pricePerEgg)+" تومان";

    document.getElementById("totalSale").innerText =
        formatNumber(totalSale)+" تومان";

    document.getElementById("salePerEgg").innerText =
        formatNumber(salePerEgg)+" تومان";

    document.getElementById("totalProfit").innerText =
        formatNumber(totalProfit)+" تومان";

    document.getElementById("profitPerEgg").innerText =
        formatNumber(profitPerEgg)+" تومان";

    document.getElementById("profitPercent").innerText =
        profitPercent.toFixed(2)+"٪";

    result.style.display="block";

    localStorage.setItem("eggCalculatorData",JSON.stringify({

        purchasePrice:purchasePrice,
        totalWeight:totalWeight,
        eggCount:eggCount,
        salePrice:salePrice

    }));

    saved.innerText="✅ اطلاعات این محاسبه روی گوشی ذخیره شد.";

    saved.style.display="block";
}

function loadSaved(){

    const data =
        localStorage.getItem("eggCalculatorData");

    const saved =
        document.getElementById("saved");

    if(!data){

        saved.innerText="هنوز اطلاعاتی ذخیره نشده است.";
        saved.style.display="block";
        return;
    }

    const values =
        JSON.parse(data);

    document.getElementById("purchasePrice").value =
        values.purchasePrice;

    document.getElementById("totalWeight").value =
        values.totalWeight;

    document.getElementById("eggCount").value =
        values.eggCount;

    document.getElementById("salePrice").value =
        values.salePrice;

    saved.innerText="✅ آخرین اطلاعات بازیابی شد.";

    saved.style.display="block";
}

</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker فعال شد"))
        .catch(error => console.log("خطا:", error));
}
</script>
</body>
</html>
